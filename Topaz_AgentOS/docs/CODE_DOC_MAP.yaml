  - code: IAF-Agent-Studio/auth/middleware.py
    docs:
      - docs/CONFIG_REFERENCE.md
      - IAF-Agent-Studio/docs/api_reference.md
    note: "JWT auth + security headers + request.state identity. Also enforces the global per-tenant API rate limit (TENANT_RATE_LIMIT_PER_MINUTE) on authenticated requests via auth/rate_limiter.is_tenant_allowed → HTTP 429; fail-open. Cache-Control: no-store applies to every response except /static/*.js|*.mjs|*.css — HTML pages reachable via the raw /static/ StaticFiles mount (e.g. /static/dashboard_v2.html) are NOT exempted, since they carry the same sensitive content as their route-handler-served equivalents. Browser JWTs carry only sub/sid/jti/type/iat/exp, so the middleware and WebSocket auth complete the identity (email, role, groups, tenant) from the user store via auth/identity.py, and authenticate_access_token runs the session gate (auth/session_registry.check, one Redis GET/MGET, fail-open): a revoked sid gets 401 SESSION_REVOKED (always; SessionRevokedError, reason cookie session_revoked) and, when AUTH_SINGLE_SESSION is on, a sid that is no longer the user's active session gets 401 SESSION_SUPERSEDED. /auth/logout and /auth/oauth/logout skip the session gate; /auth/logout-all does not, but is exempt from the temporary-password, disabled and SSO gates. GET /auth/session-policy is a public path. Agent service tokens (no sid) are exempt. SEC-4: _build_csp(nonce) replaces the old static unsafe-inline/unsafe-eval CSP string — script-src/style-src now allow only 'self' plus a fresh per-request nonce (minted in AuthMiddleware.dispatch, stashed on request.state.csp_nonce for server.py's HTML-serving routes to stamp via shared/csp_nonce.py); unsafe-eval was initially kept (superseded by Round 7 below: it is now denied by default and granted only to Alpine.js pages; Tailwind never needed it); unsafe-inline is narrowed to the CSP3 script-src-attr/style-src-attr directives only, covering existing onclick=/style= attributes without a large addEventListener rewrite. Round 4 (2026-10-13): also added base-uri 'self' (Burp 'missing base-uri', Low) and object-src 'none' (companion hardening; no <object>/<embed> used anywhere). Round 6 (2026-10-14), SEC-4b progress: font-src tightened from the wildcard '*' to 'self' data: (the wildcard matched no real dependency — the only external font stylesheet is already refused by style-src — and notably did NOT match the data: URLs vendored PDF.js emits for PDF-embedded @font-face, so that path was silently broken); _build_strict_csp(nonce) added as the SEC-4b target policy (nonce-only, no unsafe-eval, no -attr directives) and is now ENFORCED on two classes of response: paths listed in _STRICT_CSP_PATHS (markup verified clean) and every nonce-less response (all such call sites are JSON error/gate responses or redirects, which embed no inline script/style, so error responses no longer carry any unsafe-* token). Elsewhere the strict policy can be emitted as an extra Content-Security-Policy-Report-Only header via CSP_STRICT_REPORT_ONLY=true to measure remaining violations without enforcing them. _is_strict_csp_path() matches exactly, not by prefix, so one clean /static page does not exempt its siblings. Round 7 (2026-10-15), SEC-4b tier 2: 'unsafe-eval' is now DENY-BY-DEFAULT. _build_csp()'s allow_eval keyword defaults to False and is set True only for paths in _EVAL_CSP_PATHS (matched by _needs_eval()), which is _EVAL_CSP_ROUTES (the 14 named server.py routes that serve an Alpine page, including stacked decorators such as /studio + /customize) union /static/<page> for each of the 19 files in _ALPINE_PAGES. Everything else - every API route, every non-Alpine page, and any path added in future - loses the token automatically. The grant exists for exactly one dependency: Alpine.js compiles every directive expression with new Function, so without eval its bindings throw EvalError (measured: 21-1410 uncaught EvalErrors per page). The previous claim that the vendored Tailwind build also required eval is FALSE and was disproved in a real browser - with eval blocked, the v4.2.2 JIT still compiles arbitrary-value utilities (w-[137px]) on 11/11 Tailwind pages - so removing the remaining grant is blocked only on migrating to the @alpinejs/csp build, not on precompiling a stylesheet. Replaces the earlier _NO_EVAL_CSP_PATHS/_is_no_eval_csp_path denylist, which was fail-open (a new page silently got eval)."

  - code: IAF-Agent-Studio/shared/csp_nonce.py
    docs: []
    note: "SEC-4: generate_nonce() mints a per-request CSP nonce; inject_nonce(html, nonce) stamps it onto inline <script>/<style> tags (skips external script src= and is idempotent). Used by auth/middleware.py (header) and server.py/_serve_html + BasePathStaticFiles (HTML body) so the header and markup always agree. Mirrors shared/base_path.py's dependency-free, side-effect-free style. Also inserts a <script nonce=\"...\">window.__CSP_NONCE__=\"...\";</script> bootstrap right after <head> (idempotent, no-op without a <head> tag) so vendored/first-party scripts that create <style>/<script> elements at runtime (not reachable by server-side stamping) can read window.__CSP_NONCE__ and nonce themselves before appending to the DOM — see static/vendor/tailwind.min.js, static/ask-twin.js, static/privacy-gate.js, static/vendor/pdf.min.js, static/vendor/mermaid.min.js,'s post-Round-3 regression entry."

  - code: IAF-Agent-Studio/shared/static_cors.py
    docs: []
    note: "SEC-9: StaticExemptCORSMiddleware subclasses Starlette's CORSMiddleware and passes exempt path prefixes (default /static) straight through to the inner app, so no Access-Control-* header is attached for public, non-credentialed assets. Burp's CORS check flags the mere presence of those headers regardless of allowlist strictness, and 16 of 23 reported instances were /static assets. Behaviour for every non-exempt path is unchanged (same allowlist/credentials/methods/headers args, so /auth/* and /api/* keep correct CORS + preflight + Vary: Origin). Safe because CORS is only consulted by fetch/XHR reads from a foreign origin — <script src>/<link rel=stylesheet>/<img src> loads are not CORS-gated and same-origin requests ignore CORS entirely. _route_path() mirrors auth/middleware.py so exempt prefixes stay un-prefixed under ROOT_PATH sub-path deployments; non-HTTP (WebSocket) scopes are never exempt. Wired in server.py in place of CORSMiddleware."

  - code: IAF-Agent-Studio/shared/static_guard.py
    docs: []
    note: "SEC-14: is_backup_artifact(path) returns True when any segment of a static path looks like an editor/backup leftover (.bak/.orig/.old/.save/.swp/.swo/.tmp/.rej substrings, or a trailing ~). BasePathStaticFiles.get_response in server.py raises 404 for matches, because StaticFiles otherwise publishes timestamped copies like index.html.bak_optionA_20260822_085311 that contain the pre-SEC-6 localStorage auth interceptor and WebSocket ?token= pattern — a readable map of weaknesses the live pages no longer have. Their unknown suffix also means they're served as application/octet-stream, bypassing the CSP-nonce and base-path stamping that HTML gets. Blocking at the mount is preferred over deleting the files so later artefacts stay covered. Dependency-free and side-effect-free like shared/base_path.py and shared/csp_nonce.py, so it is unit-testable without importing server.py (which boots logging/engine bridge/storage)."

