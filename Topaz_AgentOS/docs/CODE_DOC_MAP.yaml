      - docs/CONFIG_REFERENCE.md
    note: "Phase 2b per-turn relationship learning (default-off WORLD_MODEL_LEARN). record_relationships confidence-gates + FK-resolves LLM-extracted triples and writes pending_review edges via EntityRegistryStore.upsert_relationship. Fed by memory._extract_reasoning_and_entities (emits triples when the flag is on) + memory.log_episode. Domain-neutral. Auto-confirm knob: _autoconfirm_threshold() reads WORLD_MODEL_AUTOCONFIRM_CONFIDENCE — an edge at/above it is written 'confirmed' (skips review), else 'pending_review' (default OFF). Phase 2c: append_event/record_outcome_event write an append-only world_events.jsonl (log-is-truth); rebuild_graph_from_events replays it into process_relationships (projector, for recovery/audit). Phase 2d: promote_relationship/reject_relationship/list_pending (governance) + resolve_graph_backend (GRAPH_BACKEND seam: relational default / AGE opt-in)."

