    note: "Runtime env vars, default values, feature flags, recovery verification controls, trace-value router controls, storage backend config registered into the runtime bridge, and ROOT_PATH (sub-path / base-path deployment behind a gateway). HARNESS_CONFIGURATION_CATALOG Appendix A is the full env-var inventory grouped by concern (keep it + CONFIG_REFERENCE.md in sync when a var is added). SEC-12: CORS_ALLOWED_ORIGINS defaults to \"\" (deny), NOT \"*\" — it previously fell back to the wildcard both when unset and when set empty, so any non-strict-mode deployment that omitted the var trusted every origin (Burp 'CORS: arbitrary origin trusted', Assessment-22311631). An empty allowlist makes CORSMiddleware match no origin and emit no Access-Control-* header, which is correct by default because the UI is same-origin with the API and same-origin requests never consult CORS. '*' is still settable for local dev but logs a boot warning, is rejected by runtime_roles.validate_enterprise_security_config under strict mode, and can never pair with allow_credentials (computed in server.py)."

  - code: IAF-Agent-Studio/shared/base_path.py
    docs:
      - deploy/k8s/README.md
      - docs/CONFIG_REFERENCE.md
    note: "Sub-path / base-path support: ROOT_PATH normalization; the inline HTML bootstrap that shims fetch/WebSocket/window.open, exposes window.apiUrl/window.wsUrl/window.navigate, rewrites root-absolute <a>/<form>/<img> on DOMContentLoaded and intercepts anchor clicks; PLUS a server-side attribute rewrite (rewrite_root_absolute_attrs) that prefixes root-absolute src/href/action so <script src>/<link href> assets in <head> (unreachable by any runtime shim) and declarative links resolve under the gateway prefix. Empty ROOT_PATH => byte-for-byte no-op. server.py injects it into every served HTML page (via _serve_html AND the BasePathStaticFiles /static mount so statically-served pages like the Mission-Mode workstream pages are covered too) and sets FastAPI/uvicorn root_path. Hard JS navigations (location.href='/...') are fixed per page with window.__BASE_PATH__ across ALL UI surfaces. Requires a paired gateway route (/qlabs/* -> agentos:8081 with WebSocket upgrade on /qlabs/ws/*)."

