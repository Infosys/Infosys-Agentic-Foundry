  - code: IAF-Agent-Studio/auth/session_registry.py
    docs:
      - docs/07_auth_and_users.md
      - docs/CONFIG_REFERENCE.md
      - IAF-Agent-Studio/docs/api_reference.md
    note: "Interactive session registry. Session index (always on): hash auth:sessions:<user_id>, field sid -> JSON {id (random public handle), sid, created_at, last_seen_at, ip, user_agent (200 chars), provider}, no tokens; register adds on login, touch updates last_seen_at on refresh (adds a missing, non-revoked session), clear removes on logout, entries older than the refresh TTL or AUTH_SESSION_MAX_HOURS are pruned; list_sessions/public_view back GET /auth/sessions. Revocation (always on): revoke (by public id) / revoke_all write auth:revoked_session:<sid> (TTL = refresh TTL + 60s) and drop the index entry; is_revoked (refresh) and check (per request: revoked + superseded in one GET/MGET) reject it. Single active session (AUTH_SINGLE_SESSION, default off): auth:active_session:<user_id> holds the current sid; register sets it and trims the index to the new login, touch extends TTL only (never rewrites the sid), clear writes a logged-out marker if still current. clear (logout / absolute-lifetime expiry) always writes the revocation marker too, so the refresh cookie logout never receives and pre-refresh access tokens die. Request-time checks fail open with a rate-limited warning; a connection/timeout error opens a 30 s circuit breaker (per client object) that skips Redis; revoke/list raise SessionStoreError. Defines SESSION_SUPERSEDED / SESSION_REVOKED and the iaf_logout_reason values session_superseded / session_revoked."

