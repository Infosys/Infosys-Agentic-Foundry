# CODE → DOCUMENTATION MAP
# When you change a code file, update every doc listed under it.
# Used by: CLAUDE.md (AI coding agent rules), .git/hooks/pre-commit (commit-time warning)
#
# Format:
#   code_file: path relative to project root
#   docs: list of doc files to update when code_file changes
#   note: (optional) what specifically to check in those docs

