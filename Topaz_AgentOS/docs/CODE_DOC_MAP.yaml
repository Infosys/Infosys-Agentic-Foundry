      - docs/help/IAF_GUIDE.md
      - IAF-Agent-Studio/docs/api_reference.md
      - IAF-Agent-Studio/docs/websocket_protocol.md
    note: "Shared AskTwin FAB, page context payload, compact response rendering. SEC-8: the fetch target is the CHAT_ENDPOINT='/api/chat' constant (same-origin literal — this is what makes Burp's 'DOM-based open redirection' finding a false positive, since URL-derived values reach the request body as context metadata, never the destination); the widget no longer reads location.* into the request body at all (commit 1c576f9) - getPageContext() returns only what the page supplies via AgentProPageContext(), and no page context function may read location.* (pinned by test_no_page_context_function_reads_the_browser_url). SEC-10 (commit 1a42201): the Ask Twin transcript is kept in memory only - saveMessages() is a no-op, loadMessages() starts empty and purges the legacy iaf_ask_twin_messages:shared sessionStorage entry, so the widget never calls sessionStorage.setItem (closes Burp 'HTML5 storage manipulation: textarea.value -> sessionStorage value'); the typed message is rebuilt code point by code point by rebuildText() (control characters dropped, length-capped) before it enters the /api/chat payload."

  - code: IAF-Agent-Studio/static/session-controls.js
    docs:
      - docs/specs/workstreams-crud-and-session-controls.md
      - docs/07_auth_and_users.md
    note: >-
      Shared session controls (WS-3/REV-5): user menu rendered into a
      [data-session-controls] mount, and the SEC-7 idle timeout installed
      unconditionally. Warn/logout minutes (default 15/20) are fetched from
      GET /auth/session-policy (shared/config.py SESSION_IDLE_WARN_MINUTES /
      SESSION_IDLE_LOGOUT_MINUTES) with a hardcoded 15/20 fallback if that
      fetch fails; index.html's own inline idle timer fetches the same
      endpoint so both stay in sync. Security-sensitive: before this the
      idle timeout existed only inside index.html, so any other authenticated
      page never signed an idle operator out. The user menu also offers
      "Active sessions" (modal over GET /auth/sessions with a per-session Sign
      out via DELETE /auth/sessions/{id}) and "Sign out of all devices" (POST
      /auth/logout-all, then the normal logout redirect).
      SEC-4b (2026-10-14): the user menu, sessions dialog and idle banner used
      to be built from innerHTML strings carrying inline style attributes,
      which only render while the CSP keeps style-src-attr 'unsafe-inline'.
      Those rules now live in a single stylesheet injected once by
      injectStyles() and stamped with window.__CSP_NONCE__ (same idiom as
      ask-twin.js / privacy-gate.js), so any page loading this module can be
      served the strict CSP. Element .style.cssText/.style.display writes are
      left as-is — CSSOM is not governed by CSP.

