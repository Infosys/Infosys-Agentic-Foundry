  - code: IAF-Agent-Studio/routers/auth.py
    docs:
      - docs/07_auth_and_users.md
      - IAF-Agent-Studio/docs/api_reference.md
      - docs/CONFIG_REFERENCE.md
    note: "Auth endpoints, JWT flow, registration modes, lockout behaviour, role->permission projection on /auth/me and login, and dynamic RBAC role management (/auth/rbac/roles). GET /auth/session-policy is public (no auth) and returns SEC-7 idle-timeout minutes from shared/config.py for the client-side idle timer. Every new login (register/login/sso/microsoft) mints a fresh sid and registers it; /auth/refresh renews with the refresh token's sid unchanged (tabs share one refresh cookie), and with AUTH_SINGLE_SESSION on a superseded sid gets 401 SESSION_SUPERSEDED plus cleared auth cookies and the iaf_logout_reason cookie; legacy refresh tokens without sid start a new session. New logins stamp auth_time=now in the refresh token and /auth/refresh carries it forward; once older than AUTH_SESSION_MAX_HOURS (0 disables; legacy tokens use iat) the refresh gets 401 SESSION_EXPIRED, the refresh jti is blacklisted, auth cookies are cleared and iaf_logout_reason=session_expired is set. /auth/logout clears its own sid from the registry and always revokes it (the iaf_refresh cookie is path-scoped to /auth/refresh and never reaches /auth/logout). Session management: _token_response records IP/user agent/provider in the session index (login/register/sso pass request); /auth/refresh rejects a revoked sid with 401 SESSION_REVOKED (refresh jti blacklisted, cookies cleared, iaf_logout_reason=session_revoked) and the expiry branch drops the sid from the index; GET /auth/sessions, DELETE /auth/sessions/{id}, POST /auth/logout-all (?keep_current=true), admin GET /auth/users/{id}/sessions and POST /auth/users/{id}/revoke-sessions; admin disable/lock, reset-password and delete revoke all of the user's sessions; every revocation is audited as SESSION_REVOKED; 503 when Redis is unavailable."

  - code: IAF-Agent-Studio/routers/oauth.py
    docs:
      - docs/07_auth_and_users.md
      - IAF-Agent-Studio/docs/api_reference.md
    note: "Keycloak SSO endpoints. The /auth/callback login issues Studio tokens through _issue_iaf_tokens, which mints and registers a fresh sid (single-session control), stamps auth_time=now in the refresh token (AUTH_SESSION_MAX_HOURS) and sets the refresh cookie plus the short-lived iaf_sso_token/iaf_sso_user handoff cookies."

