    note: "Optional OpenShell sandbox kernel backend (AGENTOS_KERNEL_BACKEND=openshell). Composed design: a local SafeKernel makes policy decisions (blocked commands + tenant egress registry) while execution is delegated to the sandbox, so isolation is added without removing governance. Update the design doc when the backend, its AGENTOS_SANDBOX_* flags, or the fail-closed behaviour changes."

