  - code: IAF-Agent-Studio/static/privacy-gate.js
    docs:
      - docs/CONFIG_REFERENCE.md
      - docs/PIA_DP_EVIDENCE_PACK.md
    note: "Shared, dependency-free app-shell Data Privacy consent gate. Included at end of body on authed shells (index.html, dashboard_v2.html, skill-builder-v2.html, twin.html, finops.html, rl_capture.html) so users who deep-link/bookmark straight into the app (bypassing login.html's post-login gateThenRedirect) still get the blocking acknowledgement overlay instead of opaque /api/* 403 PRIVACY_ACK_REQUIRED. On DOMContentLoaded reads iaf_access_token; if present, calls GET /auth/privacy/status (base-path prefixed via window.__BASE_PATH__); renders a blocking overlay only on {required:true,accepted:false}, otherwise fail-open no-op. Notice body rendered as text (no unsanitized HTML). Accept POSTs /auth/privacy/accept then reloads; Sign out clears token+user and returns to /login. Idempotent + try/catch guarded so a gate error never breaks the host page. OFF by default: overlay only appears when PRIVACY_ACK_REQUIRED=true server-side."

