[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iaf-agentos"
version = "0.1.0"
description = "IAF AgentOS CLI and bootstrap utilities"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agentos = "iaf_agentos.cli:main"

[tool.setuptools]
packages = ["iaf_agentos"]

[tool.setuptools.package-dir]
iaf_agentos = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
