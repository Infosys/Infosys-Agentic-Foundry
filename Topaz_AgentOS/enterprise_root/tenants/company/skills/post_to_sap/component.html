<div class="skill-card skill-sap" data-skill-component="post_to_sap">
  <div class="skill-card-head">
    <div>
      <div class="skill-card-kicker">Governed ERP Action</div>
      <h4>Post to SAP</h4>
    </div>
    <span class="skill-status" data-status>Draft</span>
  </div>
  <div class="skill-form-grid">
    <label>
      <span>Company Code</span>
      <input data-field="company_code" value="{{company_code}}" placeholder="1000">
    </label>
    <label>
      <span>Document Type</span>
      <input data-field="document_type" value="{{document_type}}" placeholder="SA">
    </label>
    <label>
      <span>Posting Date</span>
      <input data-field="posting_date" value="{{posting_date}}" placeholder="YYYY-MM-DD">
    </label>
    <label>
      <span>Reference</span>
      <input data-field="reference" value="{{reference}}" placeholder="Case / invoice / PO reference">
    </label>
    <label>
      <span>Currency</span>
      <input data-field="currency" value="{{currency}}" placeholder="USD">
    </label>
    <label>
      <span>Amount</span>
      <input data-field="amount" value="{{amount}}" placeholder="0.00">
    </label>
    <label>
      <span>PO Number</span>
      <input data-field="po_number" value="{{po_number}}" placeholder="PO number">
    </label>
    <label>
      <span>GR / SES Number</span>
      <input data-field="gr_number" value="{{gr_number}}" placeholder="GR or SES reference">
    </label>
    <label>
      <span>Cost Center</span>
      <input data-field="cost_center" value="{{cost_center}}" placeholder="Cost center">
    </label>
    <label>
      <span>GL Account</span>
      <input data-field="gl_account" value="{{gl_account}}" placeholder="GL account">
    </label>
    <label class="wide">
      <span>Header Text</span>
      <input data-field="header_text" value="{{header_text}}" placeholder="SAP document header text">
    </label>
    <label class="wide">
      <span>Line Text</span>
      <textarea data-field="line_text" rows="5" placeholder="Posting explanation">{{line_text}}</textarea>
    </label>
  </div>
  <div class="skill-card-actions">
    <button type="button" class="btn secondary" data-action="skill-reset">Reset Draft</button>
    <button type="button" class="btn" data-action="post-sap">Post to SAP</button>
  </div>
  <div class="skill-card-note" data-message>Review and edit the payload. You will be asked to confirm before posting.</div>
</div>
