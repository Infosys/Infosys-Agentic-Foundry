    - verify with sources
    - consensus check
    - multi-perspective
  research_decomposer:
    description: Domain-aware decomposer used by research_orchestrator. Breaks a research
      question into 3–5 sub-questions, each assigned to the most appropriate worker
      skill, using taxonomy + ContextOS for accuracy. Returns structured JSON. Not
      intended for direct end-user invocation.
    category: platform
    keywords:
    - decompose question
    - research planning
    - break down research
  research_orchestrator:
    description: Multi-perspective research using the framework's full stack. Calls
      research_decomposer for domain-aware decomposition, drafts a workstream YAML
      with per-angle target_skill assignment, submits to /api/workstreams, replies
      with a live link. Mission Mode drives parallel execution with HITL escalation
      and per-item evidence bundles. Inspired by Claude Code's /deep-research but
      built on workstreams + items_source for persistent, auditable, pause-resumable
      research.
    category: platform
    keywords:
    - deep research
    - investigate question
    - multi-perspective research
    - research from multiple angles
    - cross-check claim
    - research workflow
