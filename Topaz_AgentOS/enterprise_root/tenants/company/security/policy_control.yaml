  description: Escalate user turns that ask finance agents to expose secrets, tokens,
    passwords, or high-risk PII.
  owner: Security Governance
  version: 1
  status: draft
  risk_tier: CRITICAL
  event: BeforeTurn
  matcher: .*
  decision: escalate
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 105
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills: []
  conditions:
    any:
    - field: env.IAF_INPUT_PREVIEW
      operator: regex
      value: \b(password|secret|token|api key|private key|ssn|social security|credit
        card)\b
  approval:
    approver_role: security_reviewer
    sla_minutes: 15
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - user_id
    - input_preview
    - matched_conditions
  created_at: '2026-06-08T14:24:00+00:00'
  updated_at: '2026-06-17T17:52:05.992822+00:00'
- policy_id: ap_high_value_payment_approval
  name: AP High Value Payment Approval
  description: Require HITL approval before releasing high-value AP payments.
  owner: Finance Controls Team
  version: 1
  status: active
  risk_tier: L3
  event: PreToolUse
  matcher: shell
  decision: approve
  fail_policy: closed
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - fa_ap
    - invoice_processing_ap
  conditions:
    all:
    - field: command
      operator: contains
      value: /payments/release
    - field: extracted.amount
      operator: greater_than_or_equal
      value: '500000'
  approval:
    approver_role: finance_manager
    sla_minutes: 30
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - tool_input
    - matched_conditions
    - approval_decision
    - final_tool_result
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 150
  created_at: '2026-06-08T11:21:05.187921+00:00'
  updated_at: '2026-06-17T17:52:05.992839+00:00'
- policy_id: model_response_sensitive_data_redaction
  name: Model Response Sensitive Data Redaction
  description: Redact sensitive-looking values from model responses before they are
    returned to users or parsed by downstream runtime logic.
  owner: Security Governance
  version: 1
  status: active
  risk_tier: L2
  event: AfterModelCall
  matcher: .*
  decision: redact
  fail_policy: open
  mode: observe
  timeout_seconds: 10
  priority: 90
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills: []
  conditions:
    any:
    - field: response_content
      operator: regex
      value: \b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b
    - field: response_content
      operator: regex
      value: \b\d{3}-\d{2}-\d{4}\b
    - field: response_content
      operator: regex
      value: \b(?:\d[ -]*?){13,19}\b
    - field: response_content
      operator: regex
      value: \b(api[_ -]?key|token|secret|password)\s*[:=]\s*['"]?[^'"\s,;]+
  redaction:
    patterns:
    - name: email
      regex: \b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b
      replacement: '[REDACTED_EMAIL]'
    - name: ssn
      regex: \b\d{3}-\d{2}-\d{4}\b
      replacement: '[REDACTED_SSN]'
    - name: card
      regex: \b(?:\d[ -]*?){13,19}\b
      replacement: '[REDACTED_CARD]'
    - name: secret_assignment
      regex: \b(?:api[_ -]?key|token|secret|password)\s*[:=]\s*['"]?[^'"\s,;]+
      replacement: '[REDACTED_SECRET]'
  evidence:
    required:
    - trace_id
    - model_name
    - matched_conditions
    - redaction_applied
  created_at: '2026-06-29T14:55:00+05:30'
  updated_at: '2026-06-29T14:55:00+05:30'
