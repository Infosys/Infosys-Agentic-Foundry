version: '1.0'
policies:
- policy_id: fa_ar_sql_write_deny
  name: AR SQL Write Deny
  description: Block non-read SQL statements for AR analysis skills so AR users can
    query but cannot mutate finance data.
  owner: Finance Controls Team
  version: 1
  status: draft
  risk_tier: L3
  event: PreToolUse
  matcher: run_sql_query
  decision: deny
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 140
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - fa_ar
  conditions:
    any:
    - field: command
      operator: regex
      value: \b(update|delete|insert|drop|alter|truncate|merge|create|replace)\b
  approval:
    approver_role: finance_controller
    sla_minutes: 30
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - tool_input
    - matched_conditions
    - sql_statement
  created_at: '2026-06-08T14:21:00+00:00'
  updated_at: '2026-06-17T17:52:05.992635+00:00'
- policy_id: cron_finance_freeze_window_guard
  name: Cron Finance Freeze Window Guard
  description: Skip finance cron executions while a month-end or quarter-close freeze
    window is active.
  owner: Finance Operations Governance
  version: 1
  status: draft
  risk_tier: L3
  event: BeforeScheduleFire
  matcher: .*
  decision: deny
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 130
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - fa_ap
    - invoice_processing_ap
    - fa_ar
    - fa_gl
  conditions:
    all:
    - field: env.IAF_ENTRYPOINT
      operator: equals
      value: cron
    - field: env.FINANCE_FREEZE_WINDOW
      operator: equals
      value: active
  approval:
    approver_role: finance_ops_lead
    sla_minutes: 60
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - cron_job_id
    - matched_conditions
    - freeze_window
  created_at: '2026-06-08T14:21:00+00:00'
  updated_at: '2026-06-17T17:52:05.992667+00:00'
- policy_id: high_risk_shell_command_approval
  name: High Risk Shell Command Approval
  description: Require HITL approval before shell commands that look destructive,
    mutating, or payment-related.
  owner: Platform Risk Governance
  version: 1
  status: draft
  risk_tier: CRITICAL
  event: PreToolUse
  matcher: shell
  decision: approve
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 120
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills: []
  conditions:
    any:
    - field: command
      operator: regex
      value: \b(rm\s+-rf|curl\s+.*-X\s+(POST|PUT|PATCH|DELETE)|payment|release|delete|write-?off|transfer|chmod|chown)\b
  approval:
    approver_role: operations_approver
    sla_minutes: 15
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - tool_input
    - matched_conditions
    - approval_decision
    - final_tool_result
  created_at: '2026-06-08T14:21:00+00:00'
  updated_at: '2026-06-17T17:52:05.992685+00:00'
- policy_id: invoice_payment_region_gate
  name: Invoice Payment Region Gate
  description: Require approval before invoice payment API calls for regions outside
    the standard operating set.
  owner: AP Controls Team
  version: 1
  status: draft
  risk_tier: L3
  event: PreToolUse
  matcher: shell
  decision: approve
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 145
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - fa_ap
    - invoice_processing_ap
  conditions:
    all:
    - field: command
      operator: regex
      value: payment|payments|invoice
    - field: command
      operator: regex
      value: region=(?!US|CA|UK)
  approval:
    approver_role: regional_finance_manager
    sla_minutes: 30
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - tool_input
    - matched_conditions
    - region
    - approval_decision
  created_at: '2026-06-08T14:24:00+00:00'
  updated_at: '2026-06-17T17:52:05.992704+00:00'
- policy_id: invoice_source_evidence_required
  name: Invoice Source Evidence Required
  description: Escalate invoice-processing turns that do not carry evidence trace
    metadata for source documents.
  owner: AP Controls Team
  version: 1
  status: draft
  risk_tier: L2
  event: PostTurn
  matcher: .*
  decision: escalate
  fail_policy: open
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 180
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - invoice_processing_ap
  conditions:
    all:
    - field: env.IAF_EVIDENCE_TRACE_ID
      operator: equals
      value: ''
  approval:
    approver_role: evidence_reviewer
    sla_minutes: 60
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - evidence_trace_id
    - source_documents
    - matched_conditions
  created_at: '2026-06-08T14:24:00+00:00'
  updated_at: '2026-06-17T17:52:05.992721+00:00'
- policy_id: vendor_master_change_approval
  name: Vendor Master Change Approval
  description: Require HITL approval before vendor master updates such as bank account,
    tax ID, address, or payment terms changes.
  owner: Vendor Governance Team
  version: 1
  status: draft
  risk_tier: CRITICAL
  event: PreToolUse
  matcher: shell
  decision: approve
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 110
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - fa_ap
  conditions:
    any:
    - field: command
      operator: regex
      value: vendor.*(bank|account|iban|routing|tax|address|payment terms|terms)
    - field: command
      operator: regex
      value: (bank|iban|routing|tax id).*(vendor|supplier)
  approval:
    approver_role: vendor_master_approver
    sla_minutes: 20
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - tool_input
    - matched_conditions
    - vendor_id
    - approval_decision
  created_at: '2026-06-08T14:24:00+00:00'
  updated_at: '2026-06-17T17:52:05.992740+00:00'
