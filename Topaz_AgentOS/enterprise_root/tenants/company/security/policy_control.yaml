- policy_id: sharepoint_finance_folder_scope_guard
  name: SharePoint Finance Folder Scope Guard
  description: Deny attempts by finance skills to read SharePoint or file paths outside
    approved finance folders.
  owner: Data Access Governance
  version: 1
  status: draft
  risk_tier: L2
  event: PreToolUse
  matcher: shell
  decision: deny
  fail_policy: closed
  block_on_nonzero: true
  mode: blocking
  timeout_seconds: 10
  priority: 155
  scope:
    tenant_id: company
    agent_id: enterprise_agent
    skills:
    - fa_ap
    - fa_ar
    - fa_gl
    - invoice_processing_ap
  conditions:
    all:
    - field: command
      operator: regex
      value: sharepoint|/shared/|source_uri|download
    - field: command
      operator: not_contains
      value: /Finance/
  approval:
    approver_role: data_owner
    sla_minutes: 60
    on_timeout: escalate
  evidence:
    required:
    - trace_id
    - tool_input
    - source_uri
    - matched_conditions
  created_at: '2026-06-08T14:24:00+00:00'
  updated_at: '2026-06-17T17:52:05.992789+00:00'
