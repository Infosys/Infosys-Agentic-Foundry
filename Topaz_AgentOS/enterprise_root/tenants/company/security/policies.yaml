# --- Finance demo DB access (paired with external:db.fin_demo_writable) --------------
# The four finance workstream demo DBs now resolve to their own narrow resource instead
# of external:db.shared_tenant_databases, so the grants that used to reach them via the
# catch-all are restated here. Read access mirrors the catch-all exactly (no new human
# privilege); WRITE is granted ONLY to the service principals that execute workstreams,
# so post_and_close / gl_coding / payment_proposal can persist their results.
- id: finance-demo-db-read
  effect: allow
  groups:
  - finance
  - finance-ap
  - finance-ar
  - finance-gl
  - it-ops
  - sre
  - platform-ops
  actions:
  - access
  - use
  - read
  - test
  resources:
  - external:db.fin_demo_writable
  reason: Preserves the read access these groups already had on the finance demo databases
    via external:db.shared_tenant_databases; adds no write privilege.
- id: service-principals-can-write-finance-demo-db
  effect: allow
  groups:
  - service:cron
  - service:queue
  - service:hitl_resume
  actions:
  - access
  - use
  - read
  - write
  - call
  resources:
  - external:db.fin_demo_writable
  reason: Workstream execution must persist case posting/closure, GL coding and payment-release
    rows. Scoped to the four finance demo databases only - every other shared database
    stays read-only under external:db.shared_tenant_databases.


# ── Context item access (within a tenant) ────────────────────────────────────
# Posture: ALLOW BY DEFAULT, RESTRICT BY EXCEPTION.
#
# This engine is default-deny, so without the broad allow below every context item
# would be refused for non-admin roles the moment enforcement is switched on. The
# broad allow keeps day-to-day use frictionless; the deny rule carves out the
# sensitive folder.
#
# Restriction is by FOLDER, not per file: anything under
# /shared/contexts/restricted/ is protected automatically. That is far more
# reliable than remembering to tag each new document.
#
# Deny beats allow regardless of rule order (see yaml_provider.can), so the
# carve-out is fail-closed once a document sits in the restricted folder.
# Caveat: because deny wins, a principal holding BOTH a denied role (user/auditor)
# and an allowed one (manager) is denied. Keep roles single-valued, or grant
# access via a dedicated role rather than stacking roles.
- id: context-default-allow
  effect: allow
  roles: [user, manager, auditor]
  actions: [read, write, delete, access, use]
  resources:
    - 'context:*'
  reason: Context items are readable/editable by default; protect a document by placing
    it under /shared/contexts/restricted/ (see context-restricted-folder-deny).
- id: context-restricted-folder-deny
  effect: deny
  roles: [user, auditor]
  actions: ['*']
  resources:
    - 'context:/shared/contexts/restricted/*'
  reason: The restricted context folder is limited to managers and administrators.
