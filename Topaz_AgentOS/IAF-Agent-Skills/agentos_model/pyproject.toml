[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-model"
version = "0.1.0"
description = "AgentOS model provider metadata and LLM registry components"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Infosys Generative AI", email = "genai@infosys.com"}
]
keywords = ["agentos", "models", "llm", "provider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "agentos-contracts>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[tool.setuptools]
packages = ["agentos_model"]

[tool.setuptools.package-dir]
agentos_model = "."
