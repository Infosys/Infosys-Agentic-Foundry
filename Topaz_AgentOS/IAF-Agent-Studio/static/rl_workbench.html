      if(this.evalBuilder.isNewSuite && (this.evalBuilder.suites||[]).some(s=>s.id===id)) return 'a suite with this id already exists';
      return '';
    },
    async validateSuiteForm(){
      const err=this.suiteIdError(); if(err){ this.showToast(err); return; }
      this.evalBuilder.busy=true;
      try{ const d=await this._post(`/api/evals/validate?tenant_id=${encodeURIComponent(this.tenantId)}`,this.suitePayloadFromForm()); this.showToast(`suite valid${(d.warnings||[]).length?' · '+d.warnings[0]:''}`); }
      catch(e){ this.showToast(e.message); } finally{ this.evalBuilder.busy=false; }
    },
    async saveSuiteForm(){
      const err=this.suiteIdError(); if(err){ this.showToast(err); return; }
      const f=this.evalBuilder.suiteForm; const id=String(f.id||'').trim();
      const overwriting=!this.evalBuilder.isNewSuite && (this.evalBuilder.suites||[]).some(s=>s.id===id);
      if(overwriting && !window.confirm(`Overwrite the existing suite "${id}"?`)) return;
      const wasNew=this.evalBuilder.isNewSuite;
      this.evalBuilder.busy=true;
      try{
        const d=await this._post(`/api/evals?tenant_id=${encodeURIComponent(this.tenantId)}`,this.suitePayloadFromForm());
        this.showToast(d.message||'suite saved');
        await this.loadEvalDashboard();
        this.selectEvalSuite(d.eval);
        // T-4: guide a brand-new suite straight into authoring its golden cases.
        if(wasNew){
          const gset=(d.eval||{}).golden_set||'';
          if(gset){
            // Seed an empty golden set so Curate has a file to edit (no 404).
            try{ await this._post(`/api/evals/golden/${encodeURIComponent(gset)}?tenant_id=${encodeURIComponent(this.tenantId)}`,{cases:(this.evalBuilder.golden.cases||[])}); }catch(e){ /* best-effort seed */ }
            if(!(this.evalBuilder.golden.cases||[]).length &&
               window.confirm('Suite saved. Add golden cases now? (opens Curate)')){
              this.stage='curate';
            }
          }
        }
      }
      catch(e){ this.showToast(e.message); } finally{ this.evalBuilder.busy=false; }
    },
    async loadGoldenForSelected(){
      const s=this.selectedEvalSuite(); if(!s || !s.golden_set)return;
      try{ const d=await this._get(`/api/evals/golden/${encodeURIComponent(s.golden_set)}?tenant_id=${encodeURIComponent(this.tenantId)}`); this.evalBuilder.golden.cases=d.cases||[]; this.evalBuilder.golden.json=JSON.stringify(d.cases||[],null,2); }
      catch(e){ this.showToast(e.message); }
    },
    async saveGoldenJson(){
      const s=this.selectedEvalSuite(); if(!s || !s.golden_set)return; this.evalBuilder.busy=true;
      try{ const cases=JSON.parse(this.evalBuilder.golden.json||'[]'); const d=await this._post(`/api/evals/golden/${encodeURIComponent(s.golden_set)}?tenant_id=${encodeURIComponent(this.tenantId)}`,{cases}); this.evalBuilder.golden.cases=d.cases||cases; this.showToast(`saved ${d.total||cases.length} golden cases`); }
      catch(e){ this.showToast(e.message); } finally{ this.evalBuilder.busy=false; }
    },
    async promoteSelectedTrajectory(){
      const s=this.selectedEvalSuite(); if(!s || !this.detail)return; this.evalBuilder.busy=true;
      try{
        await this._post(`/api/evals/golden/${encodeURIComponent(s.golden_set)}/promote`,{tenant_id:this.tenantId,trajectory_id:this.detail.trajectory.id,tags:['workbench_promoted'],metadata:{source:'rl_workbench'}});
        this.showToast('trajectory promoted to golden'); await this.loadGoldenForSelected();
      }catch(e){ this.showToast(e.message); } finally{ this.evalBuilder.busy=false; }
    },
    async testEvaluator(id){
      try{ const d=await this._post(`/api/evals/evaluators/${encodeURIComponent(id)}/test`,{tenant_id:this.tenantId}); this.showToast(`evaluator ${d.verdict||'tested'} (${d.score})`); }
      catch(e){ this.showToast(e.message); }
    },
    async loadRunsForSelected(){
      const s=this.selectedEvalSuite(); if(!s)return;
      try{ const d=await this._get(`/api/evals/${encodeURIComponent(s.id)}/runs?tenant_id=${encodeURIComponent(this.tenantId)}`); this.evalBuilder.runs=d.runs||[]; if(this.evalBuilder.runs[0]&&!this.evalBuilder.gate.run_id)this.evalBuilder.gate.run_id=this.evalBuilder.runs[0].run_id; }
      catch(e){ this.showToast(e.message); }
    },
    async runSelectedSuite(){
      const s=this.selectedEvalSuite(); if(!s)return; this.evalBuilder.busy=true;
      try{
        const d=await this._post(`/api/evals/${encodeURIComponent(s.id)}/run`,{tenant_id:this.tenantId,agent_id:'enterprise_agent',user_id:'eval_runner',trigger:'manual',metadata:{source:'rl_workbench'}});
        this.showToast(`run ${d.status} · ${d.score}`); this.evalBuilder.gate.run_id=d.run_id; await this.loadRunsForSelected(); await this.loadRunTrace(d.run_id); await this.loadEvalDashboard();
      }catch(e){ this.showToast(e.message); } finally{ this.evalBuilder.busy=false; }
    },
    async loadRunTrace(runId){
      try{ this.evalBuilder.lastRun=await this._get(`/api/evals/runs/${encodeURIComponent(runId)}?tenant_id=${encodeURIComponent(this.tenantId)}`); }
      catch(e){ this.showToast(e.message); }
    },
    async loadGatesForSelected(){
      const s=this.selectedEvalSuite(); if(!s)return;
      try{ const d=await this._get(`/api/evals/${encodeURIComponent(s.id)}/gates?tenant_id=${encodeURIComponent(this.tenantId)}`); this.evalBuilder.gates=d.gates||[]; }
      catch(e){ this.showToast(e.message); }
    },
    async recordGateDecision(){
      const s=this.selectedEvalSuite(); if(!s || !this.evalBuilder.gate.run_id)return; this.evalBuilder.busy=true;
      try{
        await this._post(`/api/evals/${encodeURIComponent(s.id)}/gates`,{tenant_id:this.tenantId,run_id:this.evalBuilder.gate.run_id,decision:this.evalBuilder.gate.decision,reason:this.evalBuilder.gate.reason,metadata:{source:'rl_workbench'}});
        this.showToast('gate decision recorded'); await this.loadGatesForSelected();
      }catch(e){ this.showToast(e.message); } finally{ this.evalBuilder.busy=false; }
    },
    // ---- export ----
    async runExport(){
      this.exporter.busy=true;
      try{
        const body={tenant_id:this.tenantId, kind:this.exporter.kind, limit:Number(this.exporter.limit)||50};
        if(this.exporter.kind==='sft') body.format=this.exporter.format;
        if(this.exporter.eval_verdict) body.eval_verdict=this.exporter.eval_verdict;
        const d=await this._post('/api/rl-capture/exports',body);
        this.exporter.last=d.export||d;
        this.showToast(`exported ${this.exporter.last.row_count} ${this.exporter.kind} row(s)`);
        await this.loadSummary();
      }catch(e){ this.showToast(e.message); } finally{ this.exporter.busy=false; }
    },
    exportDownloadUrl(id){ return `/api/rl-capture/exports/${encodeURIComponent(id||'')}/download?tenant_id=${encodeURIComponent(this.tenantId)}`; },

    replayInChat(){
      const task=(this.detail?.trajectory?.task||'').trim(); if(!task){ this.showToast('no task text on this trajectory'); return; }
      try{ localStorage.setItem('rl_replay_task',task); localStorage.setItem('rl_replay_at',String(Date.now())); }catch{}
      try{ navigator.clipboard.writeText(task); }catch{}
      window.open('/','_blank'); this.showToast('task sent to chat · new tab');
    },
    copyJSON(){ try{ navigator.clipboard.writeText(JSON.stringify(this.detail,null,2)); this.showToast('JSON copied'); }catch{ this.showToast('clipboard blocked'); } },

    // helpers
    score(){ return Number(this.effectiveness.signal_richness_score||0); },
    dbShort(){ const p=this.dbPath||''; return p? p.split('/').slice(-1)[0] : '…'; },
    exportReadiness(){
      const r=this.effectiveness.export_readiness||{};
      return [
        {key:'sft',label:'SFT',ready:!!r.sft},{key:'eval',label:'Eval',ready:!!r.eval},
        {key:'dpo',label:'DPO',ready:!!r.dpo},{key:'kto',label:'KTO',ready:!!r.kto},
        {key:'rejection_sft',label:'Rejection-SFT',ready:!!r.rejection_sft},{key:'rft',label:'RFT / RL',ready:!!r.rft},
      ];
    },
    statusDot(s){ s=(s||'').toLowerCase(); if(['success','done'].includes(s))return'ok'; if(['partial','awaiting_human','pending'].includes(s))return'part'; if(['failed','cancelled'].includes(s))return'fail'; return'unk'; },
    statusStyle(s){ s=(s||'').toLowerCase(); if(['success','done'].includes(s))return'color:var(--green)'; if(['partial','awaiting_human','pending'].includes(s))return'color:var(--amber)'; if(['failed','cancelled'].includes(s))return'color:var(--red)'; return''; },
    labelKind(l){ l=(l||'').toLowerCase(); if(['up','approve','ok','pass','allow','success'].includes(l))return'pos'; if(['down','reject','fail','block','deny'].includes(l))return'neg'; return'neu'; },
    channelLabel(r){
      const c=String(r?.channel||'').toLowerCase();
      const names={thumbs:'human thumbs',human_approval:'human approval',human_edit:'human correction',evaluator:'auto-judge',critique:'self-critique',model_call_policy:'policy audit',hook:'hook',queue:'queue',workstream:'workstream'};
      const friendly=names[c]||c||'signal';
      return r?.is_judgement===false ? (friendly+' (operational)') : friendly;
    },
    relTime(iso){ if(!iso)return''; const d=new Date(iso); if(isNaN(d))return''; const s=(Date.now()-d.getTime())/1000; if(s<60)return`${Math.round(s)}s ago`; if(s<3600)return`${Math.round(s/60)}m ago`; if(s<86400)return`${Math.round(s/3600)}h ago`; return`${Math.round(s/86400)}d ago`; },
    showToast(m){ this.toast=m; if(this._toastTimer)clearTimeout(this._toastTimer); this._toastTimer=setTimeout(()=>this.toast='',2600); },
  };
}
</script>
<!-- SEC-7: shared idle-session timeout + user menu. -->
<script src="/static/session-controls.js"></script>
</body>
