; ============================================================================
; PgBouncer — transaction-pooling proxy for IAF AgentOS Postgres
; ============================================================================
; Caps the TOTAL number of real Postgres connections across the whole app fleet.
; Each app process already has an in-process psycopg_pool (DB_POOL_SIZE=10); those
; pools SUM across processes/servers and would blow past Postgres max_connections
; (=100 here). PgBouncer multiplexes many client connections onto a small, capped
; set of real PG connections, so the fleet can scale horizontally without exhausting
; the DB. Point the app's DATABASE_URL at this proxy (port 6432) instead of PG (5432).
;
; REQUIRES PgBouncer >= 1.21 — psycopg3 auto-prepares statements, which is
; incompatible with transaction pooling UNLESS PgBouncer tracks prepared statements
; (max_prepared_statements, added in 1.21). Current PgBouncer (1.22/1.23/1.24) is fine.
;
; Transaction-pooling safety was audited for this codebase: no LISTEN/NOTIFY, no
; PG advisory locks (Redis leases instead), no server-side named cursors, and all
; schema selection uses `SET LOCAL search_path` (transaction-scoped, auto-reset on
; commit). So transaction mode is safe here.

[databases]
; app-facing name  ->  real Postgres backend
agentos = host=127.0.0.1 port=5432 dbname=agentos

[pgbouncer]
; ---- listen ----
listen_addr = 127.0.0.1          ; single host. For a fleet: bind the private IP (or 0.0.0.0
                                 ; behind a firewall/security group) so app servers can reach it.
listen_port = 6432

; ---- auth (Postgres uses scram-sha-256) ----
auth_type = scram-sha-256
; Absolute path on THIS box — set this to match your checkout/deployment.
; In prod use /etc/pgbouncer/userlist.txt (chmod 600, pgbouncer-owned).
; See userlist.txt.example; generate the real file from agent_os/config.env (never commit it).
auth_file = /etc/pgbouncer/userlist.txt

; ---- pooling ----
pool_mode = transaction          ; hold a real server conn only for the duration of a transaction
max_client_conn = 2000           ; clients -> PgBouncer (cheap); raise as the fleet grows
default_pool_size = 20           ; real PG server conns per (user,db) pair = the multiplexing factor
min_pool_size = 5                ; keep a few warm
reserve_pool_size = 5            ; burst headroom
reserve_pool_timeout = 3
max_db_connections = 80          ; HARD cap on total server conns to PG. Keep < PG max_connections(=100)
                                 ; minus superuser_reserved_connections and any direct psql/admin conns.

; ---- psycopg3 compatibility in transaction mode ----
max_prepared_statements = 200    ; PgBouncer tracks each client's prepared statements and replays them
                                 ; onto whatever server conn it is assigned. REQUIRED for psycopg3.
ignore_startup_parameters = extra_float_digits, options

; ---- server hygiene ----
server_reset_query = DISCARD ALL ; only runs in session mode; harmless here (txn mode auto-resets)
server_reset_query_always = 0
server_idle_timeout = 600
server_lifetime = 3600
tcp_keepalive = 1

; ---- admin / monitoring (connect: psql -p 6432 -U postgres pgbouncer -c 'SHOW POOLS') ----
admin_users = postgres
stats_users = postgres
; logfile/pidfile: set to writable paths for your environment. Linux defaults:
; logfile = /var/log/pgbouncer/pgbouncer.log
; pidfile = /var/run/pgbouncer/pgbouncer.pid
