[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-kernel"
version = "2.3.0"
description = "AgentOS SafeKernel: sandboxed filesystem, command, credential, and external-access runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Infosys Generative AI", email = "genai@infosys.com"}
]
keywords = ["agentos", "kernel", "sandbox", "agent", "rbac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
credentials = [
    "pyyaml>=6.0",
    "cryptography>=41.0",
]
self-auth = [
    "python-jose[cryptography]>=3.3.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["agent_os"]

[tool.setuptools.package-dir]
agent_os = "."

[tool.setuptools.package-data]
agent_os = ["model_pricing.yaml", "config.env.example", "LICENSE"]
