        # Dynamic: /agentos/agents/{agent_id}/skills/{skill_name}/files
        location ~ ^/agentos/agents/([^/]+)/skills/([^/]+)/files$ {
            proxy_pass https://backend/agentos/agents/$1/skills/$2/files;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        # Dynamic: /agentos/agents/{agent_id}/skills/{skill_name}/files/{filename}
        location ~ ^/agentos/agents/([^/]+)/skills/([^/]+)/files/([^/]+)$ {
            proxy_pass https://backend/agentos/agents/$1/skills/$2/files/$3;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        # Dynamic: /agentos/agents/{agent_id}/context
        location ~ ^/agentos/agents/([^/]+)/context$ {
            proxy_pass https://backend/agentos/agents/$1/context;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        # ─── Approvals ───────────────────────────────────────────────
 
        location = /agentos/approvals {
            proxy_pass https://backend/agentos/approvals;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        # Dynamic: /agentos/approvals/{request_id}
        location ~ ^/agentos/approvals/([^/]+)$ {
            proxy_pass https://backend/agentos/approvals/$1;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        # ─── Audit ───────────────────────────────────────────────────
 
        location /agentos/audit/shell {
            proxy_pass https://backend/agentos/audit/shell;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        location /agentos/audit/approvals {
            proxy_pass https://backend/agentos/audit/approvals;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        # ─── Frontend (SPA) ──────────────────────────────────────────
 
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
 
        location /health {
            access_log off;
            add_header 'Content-Type' 'text/plain';
            return 200 "healthy";
        }
 
        error_page 500 502 503 504 /50x.html;
 
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}