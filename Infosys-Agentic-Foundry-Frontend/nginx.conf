worker_processes 1;
 
events {
    worker_connections 1024;
}
 
http {
    include       mime.types;
    default_type  application/octet-stream;
 
    sendfile        on;
    keepalive_timeout 65;
 
    # Backend
    upstream backend {
        server ${BACKEND_HOST}:443;
    }
 
    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
 
    server {
        listen       443 ssl;
        server_name  _;
 
        # Mount your own TLS cert/key at these paths (do NOT commit real certs)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
 
        # Strip upstream CSP headers and enforce strict policy
        proxy_hide_header Content-Security-Policy;
 
        # Enforce CSP on all responses (2xx/3xx/4xx/5xx)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
 
        # Additional security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 
        location /openapi.json {
            proxy_pass https://backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
        }
 
        location /auth/ {
            proxy_pass https://backend/auth/;
            proxy_http_version 1.1;
